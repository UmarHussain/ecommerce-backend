server:
  port: ${SERVER_PORT:8096}

spring:
  application:
    name: cart-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      schema: ${DATABASE_SCHEMA:cart}
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:cart}
    schemas: ${DATABASE_SCHEMA:cart}
    table: flyway_schema_history
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:cart}
        jdbc:
          time_zone: UTC
      jakarta.persistence.lock.timeout: ${CART_LOCK_TIMEOUT_MS:2000}

platform:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce-local}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce-local/protocol/openid-connect/certs}
    audience: cart-service
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8094}
    connect-timeout: ${CATALOG_CONNECT_TIMEOUT:300ms}
    read-timeout: ${CATALOG_READ_TIMEOUT:800ms}
    pool-acquire-timeout: ${CATALOG_POOL_ACQUIRE_TIMEOUT:300ms}

resilience4j:
  circuitbreaker:
    instances:
      cartCatalog:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.umar.ecommerce.cart.catalog.CatalogTechnicalException
        ignoreExceptions:
          - com.umar.ecommerce.cart.exception.CartProblem
  retry:
    instances:
      cartCatalog:
        maxAttempts: 2
        waitDuration: 80ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 200ms
        enableRandomizedWait: true
        randomizedWaitFactor: 0.5
        retryExceptions:
          - com.umar.ecommerce.cart.catalog.CatalogTechnicalException
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - com.umar.ecommerce.cart.exception.CartProblem

management:
  health:
    circuitbreakers:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,circuitbreakers,retries
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
    circuitbreakers:
      enabled: true
    retries:
      enabled: true
