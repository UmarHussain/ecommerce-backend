server:
  port: ${SERVER_PORT:8095}

spring:
  application:
    name: inventory-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      schema: ${DATABASE_SCHEMA:inventory}
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:inventory}
    schemas: ${DATABASE_SCHEMA:inventory}
    table: flyway_schema_history
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:inventory}
        jdbc:
          time_zone: UTC

platform:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce-local}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce-local/protocol/openid-connect/certs}
    audience: inventory-service
  catalog:
    base-url: ${CATALOG_SERVICE_URL:http://localhost:8094}
    connect-timeout: ${CATALOG_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATALOG_READ_TIMEOUT:2s}
    pool-acquire-timeout: ${CATALOG_POOL_ACQUIRE_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
