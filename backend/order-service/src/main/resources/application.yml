server:
  port: ${SERVER_PORT:8097}

spring:
  application:
    name: order-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      schema: ${DATABASE_SCHEMA:order}
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:order}
    schemas: ${DATABASE_SCHEMA:order}
    table: flyway_schema_history
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Hibernate must retain SQL quoting because "order" is a PostgreSQL keyword.
        default_schema: '"${DATABASE_SCHEMA:order}"'
        globally_quoted_identifiers: true
        jdbc:
          time_zone: UTC
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:59092}
    producer:
      acks: all
      properties:
        enable.idempotence: true
    consumer:
      group-id: order-checkout
      auto-offset-reset: earliest
      enable-auto-commit: false
    listener:
      ack-mode: manual

checkout:
  quote-ttl: ${CHECKOUT_QUOTE_TTL:10m}
  command-timeout: ${CHECKOUT_COMMAND_TIMEOUT:15s}
  outbox:
    poll-delay: ${CHECKOUT_OUTBOX_POLL_DELAY:2000}
  saga:
    poll-delay: ${CHECKOUT_SAGA_POLL_DELAY:1000}

platform:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce-local}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce-local/protocol/openid-connect/certs}
    audience: order-service

resilience4j:
  circuitbreaker:
    instances:
      checkoutUpstream:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 8
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 1
        automaticTransitionFromOpenToHalfOpenEnabled: true
        recordExceptions:
          - com.umar.ecommerce.order.remote.CheckoutRemote$OrderUpstreamException
        ignoreExceptions:
          - com.umar.ecommerce.order.exception.OrderProblem
  retry:
    instances:
      checkoutUpstream:
        maxAttempts: 2
        waitDuration: 80ms
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2
        exponentialMaxWaitDuration: 200ms
        retryExceptions:
          - com.umar.ecommerce.order.remote.CheckoutRemote$OrderUpstreamException
        ignoreExceptions:
          - io.github.resilience4j.circuitbreaker.CallNotPermittedException
          - com.umar.ecommerce.order.exception.OrderProblem

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
