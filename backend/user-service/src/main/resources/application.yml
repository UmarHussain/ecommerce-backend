server:
  port: ${SERVER_PORT:8093}

spring:
  application:
    name: user-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      schema: ${DATABASE_SCHEMA:user}
      connection-init-sql: SET TIME ZONE 'UTC'; SET search_path TO "user"
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:user}
    schemas: ${DATABASE_SCHEMA:user}
    table: flyway_schema_history
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:user}
        auto_quote_keyword: true
        jdbc:
          time_zone: UTC

platform:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce-local}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce-local/protocol/openid-connect/certs}
    audience: user-service
  keycloak:
    realm: ecommerce-local
    token-uri: ${KEYCLOAK_ADMIN_TOKEN_URI:http://localhost:8180/realms/ecommerce-local/protocol/openid-connect/token}
    admin-base-uri: ${KEYCLOAK_ADMIN_BASE_URI:http://localhost:8180/admin/realms/ecommerce-local}
    client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:user-service-admin}
    client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
    connect-timeout: 2s
    read-timeout: 8s

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
