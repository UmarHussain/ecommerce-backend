server:
  port: ${SERVER_PORT:8094}

spring:
  application:
    name: catalog-service
  mvc:
    problemdetails:
      enabled: true
  datasource:
    url: ${DATABASE_URL:}
    username: ${DATABASE_USERNAME:}
    password: ${DATABASE_PASSWORD:}
    hikari:
      schema: ${DATABASE_SCHEMA:catalog}
      connection-init-sql: SET TIME ZONE 'UTC'
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:2}
      connection-timeout: ${DATABASE_CONNECTION_TIMEOUT_MS:30000}
      validation-timeout: ${DATABASE_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DATABASE_IDLE_TIMEOUT_MS:600000}
      max-lifetime: ${DATABASE_MAX_LIFETIME_MS:1800000}
  flyway:
    enabled: true
    locations: classpath:db/migration
    default-schema: ${DATABASE_SCHEMA:catalog}
    schemas: ${DATABASE_SCHEMA:catalog}
    table: flyway_schema_history
    create-schemas: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: ${DATABASE_SCHEMA:catalog}
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:56379}
      timeout: ${REDIS_COMMAND_TIMEOUT:200ms}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:200ms}
      repositories:
        enabled: false
  cache:
    type: ${CATALOG_CACHE_TYPE:redis}

platform:
  security:
    issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8180/realms/ecommerce-local}
    jwk-set-uri: ${OIDC_JWK_SET_URI:http://localhost:8180/realms/ecommerce-local/protocol/openid-connect/certs}
    audience: catalog-service
  catalog-cache:
    categories-ttl: ${CATALOG_CACHE_CATEGORIES_TTL:60s}
    products-ttl: ${CATALOG_CACHE_PRODUCTS_TTL:45s}
    product-ttl: ${CATALOG_CACHE_PRODUCT_TTL:45s}
    variants-ttl: ${CATALOG_CACHE_VARIANTS_TTL:30s}
    ttl-jitter: ${CATALOG_CACHE_TTL_JITTER:5s}
management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
