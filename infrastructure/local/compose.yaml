name: ecommerce-local-platform
services:
  postgres:
    image: postgres:16.10
    environment:
      POSTGRES_USER: platform_bootstrap
      POSTGRES_DB: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make bootstrap}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run make bootstrap}
      USER_DB_PASSWORD: ${USER_DB_PASSWORD:?Run make bootstrap}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:?Run make bootstrap}
      INVENTORY_DB_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run make bootstrap}
      CART_DB_PASSWORD: ${CART_DB_PASSWORD:?Run make bootstrap}
      ORDER_DB_PASSWORD: ${ORDER_DB_PASSWORD:?Run make bootstrap}
      PAYMENT_DB_PASSWORD: ${PAYMENT_DB_PASSWORD:?Run make bootstrap}
    ports:
    - 127.0.0.1:55432:5432
    volumes:
    - postgres-data:/var/lib/postgresql/data
    - ./postgres/01-databases.sh:/docker-entrypoint-initdb.d/01-databases.sh:ro
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U platform_bootstrap -d postgres
      interval: 5s
      timeout: 5s
      retries: 20
  keycloak:
    image: quay.io/keycloak/keycloak:26.4.0
    command:
    - start-dev
    - --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloakdb
      KC_DB_USERNAME: keycloak_app
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?Run make bootstrap}
      KC_HOSTNAME: http://localhost:8180
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-local-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?Run make bootstrap}
      KC_HEALTH_ENABLED: 'true'
    ports:
    - 127.0.0.1:8180:8080
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
    - ../../.local/keycloak:/opt/keycloak/data/import:ro
  redis:
    image: redis:7.4.5
    profiles:
    - cache
    command:
    - redis-server
    - --appendonly
    - 'yes'
    ports:
    - 127.0.0.1:56379:6379
    volumes:
    - redis-data:/data
  kafka:
    image: apache/kafka:3.9.1
    profiles:
    - events
    environment:
      KAFKA_NODE_ID: '1'
      KAFKA_PROCESS_ROLES: broker,controller
      # PLAINTEXT: inside the Compose network (kafka:9092). EXTERNAL: host/IDE access via localhost:59092.
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:59092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: '1'
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: '1'
      # /var/lib/kafka/data exists in the image and is owned by the non-root kafka user,
      # so the named volume inherits writable ownership (/tmp/kraft-combined-logs did not).
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    ports:
    - 127.0.0.1:59092:9094
    volumes:
    - kafka-data:/var/lib/kafka/data
  api-gateway:
    profiles:
    - apps
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE: api-gateway
    environment:
      SERVER_PORT: '8090'
      OIDC_ISSUER_URI: http://localhost:8180/realms/ecommerce-local
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/certs
      USER_SERVICE_URL: http://user-service:8093
      CATALOG_SERVICE_URL: http://catalog-service:8094
      INVENTORY_SERVICE_URL: http://inventory-service:8095
      CART_SERVICE_URL: http://cart-service:8096
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
      user-service:
        condition: service_started
      catalog-service:
        condition: service_started
      inventory-service:
        condition: service_started
    mem_limit: 512m
    ports:
    - 127.0.0.1:8090:8090
  user-service:
    profiles:
    - apps
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE: user-service
    environment:
      SERVER_PORT: '8093'
      OIDC_ISSUER_URI: http://localhost:8180/realms/ecommerce-local
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/certs
      DATABASE_URL: jdbc:postgresql://postgres:5432/userdb
      DATABASE_USERNAME: user_app
      DATABASE_PASSWORD: ${USER_DB_PASSWORD:?Run make bootstrap}
      DATABASE_SCHEMA: user
      SPRING_PROFILES_ACTIVE: local
      KEYCLOAK_ADMIN_TOKEN_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/token
      KEYCLOAK_ADMIN_BASE_URI: http://keycloak:8080/admin/realms/ecommerce-local
      KEYCLOAK_ADMIN_CLIENT_ID: user-service-admin
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${USER_SERVICE_ADMIN_SECRET:?Run make bootstrap}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 512m
  catalog-service:
    profiles:
    - apps
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE: catalog-service
    environment:
      SERVER_PORT: '8094'
      OIDC_ISSUER_URI: http://localhost:8180/realms/ecommerce-local
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/certs
      DATABASE_URL: jdbc:postgresql://postgres:5432/catalogdb
      DATABASE_USERNAME: catalog_app
      DATABASE_PASSWORD: ${CATALOG_DB_PASSWORD:?Run make bootstrap}
      DATABASE_SCHEMA: catalog
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 512m
  inventory-service:
    profiles:
    - apps
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE: inventory-service
    environment:
      SERVER_PORT: '8095'
      OIDC_ISSUER_URI: http://localhost:8180/realms/ecommerce-local
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/certs
      DATABASE_URL: jdbc:postgresql://postgres:5432/inventorydb
      DATABASE_USERNAME: inventory_app
      DATABASE_PASSWORD: ${INVENTORY_DB_PASSWORD:?Run make bootstrap}
      DATABASE_SCHEMA: inventory
      CATALOG_SERVICE_URL: http://catalog-service:8094
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 512m
  cart-service:
    profiles:
    - later
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE: cart-service
    environment:
      SERVER_PORT: '8096'
      OIDC_ISSUER_URI: http://localhost:8180/realms/ecommerce-local
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/certs
      DATABASE_URL: jdbc:postgresql://postgres:5432/cartdb
      DATABASE_USERNAME: cart_app
      DATABASE_PASSWORD: ${CART_DB_PASSWORD:?Run make bootstrap}
      DATABASE_SCHEMA: cart
      CATALOG_SERVICE_URL: http://catalog-service:8094
      SPRING_PROFILES_ACTIVE: local
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 512m
  order-service:
    profiles:
    - later
    build:
      context: ../../backend
      dockerfile: Dockerfile
      args:
        SERVICE: order-service
    environment:
      SERVER_PORT: '8097'
      OIDC_ISSUER_URI: http://localhost:8180/realms/ecommerce-local
      OIDC_JWK_SET_URI: http://keycloak:8080/realms/ecommerce-local/protocol/openid-connect/certs
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    mem_limit: 512m
  mailpit:
    image: axllent/mailpit:v1.27.2
    profiles:
    - mail
    ports:
    - 127.0.0.1:8025:8025
    - 127.0.0.1:1025:1025
volumes:
  postgres-data: {}
  redis-data: {}
  kafka-data: {}
